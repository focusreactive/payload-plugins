name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Git hooks are a developer's convenience, and this job does not install the apps, so the pre-push
  # hook's repo-wide check-types cannot pass here. It would run on the commit semantic-release pushes
  # back and take the release down with it. CI runs its own checks in their own steps.
  LEFTHOOK: "0"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Authenticate private git dependencies
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git config --global --add \
            "url.https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/.insteadOf" \
            "https://www.github.com/"

      # Everything but the apps. One of them pulls a private repository over git, which made every
      # release depend on a token the release has no use for. Said as an exclusion rather than as
      # `--filter './packages/*'`: that form leaves out the root workspace, and the release tools
      # themselves live there.
      - name: Install dependencies
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun install --frozen-lockfile --filter '!./apps/*'

      - name: Build
        run: bunx turbo run build --filter='./packages/*'

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run release
