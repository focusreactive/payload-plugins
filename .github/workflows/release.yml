name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Authenticate private git dependencies
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git config --global --add \
            "url.https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/.insteadOf" \
            "https://www.github.com/"

      # Only the publishable packages, which is all this workflow builds and releases. The apps are
      # left out on purpose: one of them pulls a private repository over git, so installing them made
      # every release depend on a token the release itself has no use for.
      - name: Install dependencies
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun install --frozen-lockfile --filter './packages/*'

      - name: Build
        run: bunx turbo run build --filter='./packages/*'

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run release
