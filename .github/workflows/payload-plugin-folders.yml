name: Payload plugin folders

# Checks for packages/payload-plugin-folders, which is its own npm project (the root workspaces list
# excludes it, see the package's README). Every step runs inside the package with npm.
#
# Lint is left out on purpose: it runs through ultracite from the repository root with bun, and the
# root oxlint and oxfmt configs import ultracite from the root node_modules, which only a full
# workspace install provides. `./check.sh` runs it locally.

on:
  pull_request:
    paths:
      - "packages/payload-plugin-folders/**"
      - ".github/workflows/payload-plugin-folders.yml"

permissions:
  contents: read

# A new push to the same pull request replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/payload-plugin-folders

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Types, README, unit and SQLite tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: packages/payload-plugin-folders/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: README code blocks
        run: npm run check:readme

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests on SQLite
        run: npm run test:int

  postgres:
    name: Integration tests on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The test harness starts its own cluster unless this is set; with it set, every test file
      # gets its own schema in this database.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: packages/payload-plugin-folders/package-lock.json

      - name: Install
        run: npm ci

      - name: Integration tests on Postgres
        run: npm run test:int:postgres

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: packages/payload-plugin-folders/package-lock.json

      - name: Install
        run: npm ci

      - name: Read the Playwright version from the lockfile
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and its system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install the system libraries only, the browser came from the cache
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Playwright starts the dev server itself, seeds a temporary SQLite database and stops the
      # server when it ends.
      - name: Browser tests
        run: npm run test:e2e

      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: packages/payload-plugin-folders/test-results
          if-no-files-found: ignore
          retention-days: 7
