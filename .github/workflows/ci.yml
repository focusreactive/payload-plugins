name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LEFTHOOK: "0"
  TURBO_UI: "false"

jobs:
  packages:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter '!./apps/*'

      - name: Build
        run: bunx turbo run build --filter='./packages/*'

      - name: Lint
        run: bunx turbo run lint --filter='./packages/*' --continue

      - name: Check types
        run: bunx turbo run check-types --filter='./packages/*' --continue

      - name: Test
        run: bunx turbo run test --filter='./packages/*' --continue
