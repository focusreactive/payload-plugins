# Edge proxy used by docker-compose: plays the role of the client's existing Nginx/Traefik.
# Terminates HTTP on :8080, forwards everything to the CMS container and serves uploaded media
# straight from the shared volume (so the Node process never streams files).
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  client_max_body_size 50m;
  proxy_temp_path /tmp/nginx-proxy; client_body_temp_path /tmp/nginx-body;
  fastcgi_temp_path /tmp/nginx-fastcgi; uwsgi_temp_path /tmp/nginx-uwsgi; scgi_temp_path /tmp/nginx-scgi;

  upstream cms { server cms:3000; }

  server {
    listen 8080;
    server_name _;

    # Uploaded media (public/media in the container, a volume in compose).
    location /media/ {
      alias /srv/media/;
      expires 30d;
      add_header Cache-Control "public";
      try_files $uri =404;
    }

    # Hashed Next.js assets are immutable.
    location /_next/static/ {
      proxy_pass http://cms;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location / {
      proxy_pass http://cms;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_read_timeout 120s;
    }
  }
}
