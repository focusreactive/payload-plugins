# Nginx config for the `site` image (public static website). Unprivileged: pid/temp in /tmp, :8080.
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml application/atom+xml application/rss+xml image/svg+xml;
  proxy_temp_path /tmp/nginx/proxy; client_body_temp_path /tmp/nginx/body;
  fastcgi_temp_path /tmp/nginx/fastcgi; uwsgi_temp_path /tmp/nginx/uwsgi; scgi_temp_path /tmp/nginx/scgi;

  server {
    listen 8080;
    server_name _;
    root /var/www/site;
    index index.html;

    # Legacy redirects live here in production (one `return 308` per moved page, generated by the
    # build). The demo image keeps them in the application; this block shows where they go.
    # location = /automotive.html { return 308 /sectors/automotive; }

    location /_next/static/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /media/        { expires 30d; add_header Cache-Control "public"; }

    location / {
      try_files $uri $uri/ $uri.html /404.html;
    }
  }
}
