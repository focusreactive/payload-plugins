<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Language and market are separate axes">
  <rect width="640" height="360" fill="#FBFAF7"/>
  <text x="40" y="44.6" font-family="Archivo, Helvetica, sans-serif" font-size="11" letter-spacing="1.6" fill="#6B6459">LANGUAGE DECIDES WORDING</text>
  <text x="40" y="204.0" font-family="Archivo, Helvetica, sans-serif" font-size="11" letter-spacing="1.6" fill="#6B6459">MARKET DECIDES VISIBILITY</text>
  <g font-family="Newsreader, Georgia, serif" font-size="15" fill="#12100E">
    <text x="40" y="78.9">English</text><text x="150" y="78.9">Français</text><text x="268" y="78.9">日本語</text>
    <text x="360" y="78.9">한국어</text><text x="452" y="78.9">简体</text><text x="524" y="78.9">繁體</text>
    <text x="40" y="238.3">UK</text><text x="110" y="238.3">France</text><text x="212" y="238.3">Japan</text>
    <text x="300" y="238.3">Korea</text><text x="384" y="238.3">Greater China</text>
    <text x="40" y="269.1">Canada</text><text x="150" y="269.1">USA</text><text x="232" y="269.1">Germany</text>
    <text x="348" y="269.1">Netherlands</text>
  </g>
  <line x1="40" y1="92.6" x2="600" y2="92.6" stroke="#E3DED5" stroke-width="1"/>
  <line x1="40" y1="282.9" x2="600" y2="282.9" stroke="#E3DED5" stroke-width="1"/>
  <g font-family="Archivo, Helvetica, sans-serif" font-size="13" fill="#1F4B43">
    <text x="40" y="128.6">17 services in English</text>
    <text x="40" y="150.9">8 in French</text>
    <text x="40" y="173.1">5 in Japanese</text>
  </g>
  <text x="40" y="325.7" font-family="Newsreader, Georgia, serif" font-size="15" fill="#12100E">Six languages against nine markets: a decision, not a gap.</text>
</svg>
