<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Language and market are separate axes">
  <rect width="640" height="420" fill="#FBFAF7"/>
  <text x="40" y="52" font-family="Archivo, Helvetica, sans-serif" font-size="11" letter-spacing="1.6" fill="#6B6459">LANGUAGE DECIDES WORDING</text>
  <text x="40" y="238" font-family="Archivo, Helvetica, sans-serif" font-size="11" letter-spacing="1.6" fill="#6B6459">MARKET DECIDES VISIBILITY</text>
  <g font-family="Newsreader, Georgia, serif" font-size="15" fill="#12100E">
    <text x="40" y="92">English</text><text x="150" y="92">Français</text><text x="268" y="92">日本語</text>
    <text x="360" y="92">한국어</text><text x="452" y="92">简体</text><text x="524" y="92">繁體</text>
    <text x="40" y="278">UK</text><text x="110" y="278">France</text><text x="212" y="278">Japan</text>
    <text x="300" y="278">Korea</text><text x="384" y="278">Greater China</text>
    <text x="40" y="314">Canada</text><text x="150" y="314">USA</text><text x="232" y="314">Germany</text>
    <text x="348" y="314">Netherlands</text>
  </g>
  <line x1="40" y1="108" x2="600" y2="108" stroke="#E3DED5" stroke-width="1"/>
  <line x1="40" y1="330" x2="600" y2="330" stroke="#E3DED5" stroke-width="1"/>
  <g font-family="Archivo, Helvetica, sans-serif" font-size="13" fill="#1F4B43">
    <text x="40" y="150">17 services in English</text>
    <text x="40" y="176">8 in French</text>
    <text x="40" y="202">5 in Japanese</text>
  </g>
  <text x="40" y="380" font-family="Newsreader, Georgia, serif" font-size="15" fill="#12100E">Six languages against nine markets: a decision, not a gap.</text>
</svg>
