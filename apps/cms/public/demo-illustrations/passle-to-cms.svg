<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="An article arrives from Passle and is enriched in the CMS">
  <rect width="640" height="360" fill="#FBFAF7"/>
  <rect x="40" y="96" width="146" height="84" fill="#FFFFFF" stroke="#12100E" stroke-width="1.5"/>
  <text x="58" y="128" font-family="Newsreader, Georgia, serif" font-size="15" fill="#12100E">Passle</text>
  <text x="58" y="150" font-family="Archivo, Helvetica, sans-serif" font-size="9.5" letter-spacing="1.2" fill="#6B6459">AUTHOR PUBLISHES</text>
  <path d="M186 138 H 240" stroke="#1F4B43" stroke-width="1.5"/>
  <path d="M234 133 l 8 5 -8 5" fill="#1F4B43"/>
  <text x="190" y="126" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10.5" fill="#1F4B43">shortcode</text>
  <rect x="244" y="70" width="168" height="136" fill="#FFFFFF" stroke="#12100E" stroke-width="1.5"/>
  <text x="262" y="100" font-family="Newsreader, Georgia, serif" font-size="15" fill="#12100E">Content platform</text>
  <g font-family="Archivo, Helvetica, sans-serif" font-size="11" fill="#12100E">
    <text x="262" y="126">pulls the article</text>
    <text x="262" y="148">matches the author</text>
    <text x="262" y="170">files it by practice area</text>
    <text x="262" y="192">keeps editor additions</text>
  </g>
  <path d="M412 138 H 466" stroke="#1F4B43" stroke-width="1.5"/>
  <path d="M460 133 l 8 5 -8 5" fill="#1F4B43"/>
  <rect x="470" y="96" width="126" height="84" fill="#FFFFFF" stroke="#12100E" stroke-width="1.5"/>
  <text x="488" y="128" font-family="Newsreader, Georgia, serif" font-size="15" fill="#12100E">Website</text>
  <text x="488" y="150" font-family="Archivo, Helvetica, sans-serif" font-size="9.5" letter-spacing="1.2" fill="#6B6459">SIX LANGUAGES</text>
  <text x="40" y="262" font-family="Newsreader, Georgia, serif" font-size="16" fill="#12100E">3,115 of roughly 3,800 items already come this way.</text>
  <text x="40" y="290" font-family="Archivo, Helvetica, sans-serif" font-size="12" fill="#6B6459">Nobody copies text between systems.</text>
</svg>
